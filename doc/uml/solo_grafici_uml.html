<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Diagrammi UML</title>
<style>
  @page { size: A4; margin: 14mm; }
  @page land { size: A4 landscape; margin: 12mm; }
  section.land { page: land; }
  section.land img { max-height: 165mm; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1f2430; margin: 0; background: #fff; }
  section { break-after: page; text-align: center; }
  section:last-child { break-after: auto; }
  h1 { font-size: 13pt; color: #2b5797; text-align: left; margin: 0 0 10px; }
  img { max-width: 100%; max-height: 245mm; }
</style>
</head>
<body>
<section class="land"><h1>1. Architettura</h1><img src="01_architettura.svg" alt="Architettura"></section>
<section><h1>2. Classi del motore</h1><img src="02_classi.svg" alt="Classi"></section>
<section><h1>3. Ciclo di vita del viewer</h1><img src="03_ciclo_viewer.svg" alt="Ciclo di vita" style="max-height: 150mm"></section>
<section class="land"><h1>4. Scene graph del viewer</h1><img src="04_scene_graph.svg" alt="Scene graph"></section>
<section class="land"><h1>5. Caricamento del file .glb</h1><img src="05_caricamento_glb.svg" alt="Caricamento glb"></section>
</body>
</html>
